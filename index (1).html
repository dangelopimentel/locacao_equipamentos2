<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171c">
<link rel="icon" href="icon-192.png">
<title>Locação de Equipamentos — Omega Construtora</title>
<style>
:root{--bg:#14171c;--panel:#1b1f26;--line:#2a2f38;--ink:#e8eaed;--sub:#8b93a1;--accent:#f2a63a;--red:#c0242c;--ok:#4caf7d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:8px;padding:5px 9px;display:flex;border-bottom:3px solid var(--red)}
.logo img{height:38px}
h1{margin:0;font-size:1.25rem}h1 span{color:var(--accent)}
.sub{color:var(--sub);font-size:.78rem;margin-top:2px}
#refresh{background:var(--accent);color:#1a1408;border:0;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer}
main{padding:16px 18px 40px;max-width:1300px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
select{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:6px;font-size:.84rem;max-width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:9px 16px;cursor:pointer;color:var(--sub);font-weight:600;font-size:.86rem;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;padding:12px 14px}
.card .n{font-size:1.3rem;font-weight:700}.card .l{color:var(--sub);font-size:.7rem;text-transform:uppercase;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
h3{margin:0 0 10px;font-size:.78rem;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.br{display:grid;grid-template-columns:minmax(80px,32%) 1fr;gap:4px 8px;align-items:center;margin-bottom:7px;font-size:.76rem}
.br .bt{background:#232830;border-radius:3px;height:14px}.br .bt i{display:block;height:100%;background:var(--accent);border-radius:3px}
.br .bv{grid-column:2;color:var(--sub);font-size:.7rem;margin-top:-4px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--sub);text-transform:uppercase;font-size:.68rem}
.num{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;background:#20242c}
.rbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.rbar button{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.8rem}
.thead,summary,.leaf{display:grid;grid-template-columns:1fr 60px 130px;gap:8px;align-items:center}
.thead{padding:8px 12px;color:var(--sub);font-size:.68rem;text-transform:uppercase;background:#20242c;border-radius:6px 6px 0 0}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:9px 12px;font-weight:600;font-size:.84rem}
summary::-webkit-details-marker{display:none}
summary>span:first-child::before{content:"▸ ";color:var(--sub)}details[open]>summary>span:first-child::before{content:"▾ "}
details details{margin-left:16px}details details summary{font-weight:500}
.leaf{padding:7px 12px;font-size:.8rem;color:#cfd3da;margin-left:16px}
.d1>summary{background:var(--panel);border-left:3px solid var(--accent)}
.q{text-align:right;color:var(--sub)}.p{text-align:right;font-family:Consolas,monospace}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.wrap table{white-space:nowrap}.hidden{display:none}#status{padding:40px;text-align:center;color:var(--sub)}
</style>
</head>

const $=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const el=i=>document.getElementById(i);

function agrupar(rows,c){const m={};rows.forEach(r=>{const k=String(r[c]||"—");(m[k]=m[k]||[]).push(r)});
 return Object.entries(m).map(([k,it])=>({k,it,q:it.length,soma:it.reduce((s,d)=>s+P(d),0)})).sort((a,b)=>b.soma-a.soma)}
function barras(t,g){const m=Math.max(...g.map(x=>x.soma),1);
 return `<div class="box"><h3>${t}</h3>${g.map(x=>`<div class="br"><span class="bl" title="${x.k}">${x.k}</span><div class="bt"><i style="width:${x.soma/m*100}%"></i></div><span class="bv">${$(x.soma)} · ${x.q} un.</span></div>`).join("")}</div>`}
function filtrar(){return dados.filter(d=>F.every(c=>!at[c]||String(d[c])===at[c]))}

async function carregar(){
 el("status").classList.remove("hidden");el("status").textContent="Buscando dados da planilha…";
 ["painel","rel","dados"].forEach(s=>el(s).classList.add("hidden"));el("refresh").disabled=true;
 try{const r=await fetch(URL_DADOS,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
  dados=await r.json();el("updated").textContent="Atualizado em "+new Date().toLocaleString("pt-BR");
  montar();el("status").classList.add("hidden");render();
 }catch(e){el("status").textContent="Não consegui buscar os dados ("+e.message+"). Tente atualizar de novo."}
 finally{el("refresh").disabled=false}}

function montar(){
 const box=el("filters");box.innerHTML="";
 F.forEach(c=>{const v=[...new Set(dados.map(d=>d[c]).filter(x=>x!==undefined&&x!==""))].sort();
  const s=document.createElement("select");s.innerHTML=`<option value="">${c}: todos</option>`+v.map(x=>`<option>${x}</option>`).join("");
  if(c==="MANUT."&&v.includes("N")){s.value="N";at[c]="N"}
  s.onchange=()=>{at[c]=s.value;render()};box.appendChild(s)});
 el("relsel").innerHTML=Object.keys(REL).map(k=>`<option>${k}</option>`).join("");
 el("relsel").onchange=render}

function tree(g,n,d){
 return g.map(x=>{ if(d===n.length-1)return `<div class="leaf"><span>${x.k}</span><span class="q">${x.q}</span><span class="p">${$(x.soma)}</span></div>`;
  return `<details class="${d?"":"d1"}"><summary><span>${x.k}</span><span class="q">${x.q}</span><span class="p">${$(x.soma)}</span></summary>${tree(agrupar(x.it,n[d+1]),n,d+1)}</details>`}).join("")}

function render(){
 const r=filtrar(),tot=r.reduce((s,d)=>s+P(d),0);
 // painel
 const nat=agrupar(r,"NATUREZA");
 el("painel").innerHTML=`<div class="cards">
  <div class="card"><div class="n">${r.length}</div><div class="l">Equipamentos</div></div>
  <div class="card"><div class="n">${$(tot)}</div><div class="l">Total mensal</div></div>
  <div class="card"><div class="n">${agrupar(r,"EMPRESA").length}</div><div class="l">Locadores</div></div>
  <div class="card"><div class="n">${agrupar(r,"CENTRO DE CUSTO").length}</div><div class="l">Centros de custo</div></div></div>
  <div class="grid"><div class="box"><h3>Natureza / Qtd / Preço</h3><table><tr><th>Natureza</th><th class="num">Qtd</th><th class="num">Preço</th></tr>
  ${nat.map(x=>`<tr><td>${x.k}</td><td class="num">${x.q}</td><td class="num">${$(x.soma)}</td></tr>`).join("")}
  <tr class="tot"><td>Total geral</td><td class="num">${r.length}</td><td class="num">${$(tot)}</td></tr></table></div>
  ${barras("Preço por natureza",nat)}</div>
  <div class="grid">${barras("Top locadores",agrupar(r,"EMPRESA").slice(0,8))}${barras("Top equipamentos",agrupar(r,"EQUIPAMENTO").slice(0,8))}${barras("Centros de custo",agrupar(r,"CENTRO DE CUSTO").slice(0,8))}</div>`;
 // relatórios
 const n=REL[el("relsel").value]||REL[Object.keys(REL)[0]],g=agrupar(r,n[0]);
 el("relchart").innerHTML=`<div class="grid">${barras("Comparativo — "+n[0]+" (maiores preços)",g.slice(0,10))}</div>`;
 el("relhead").innerHTML=`<span>${n.join(" / ")}</span><span class="q">QTD</span><span class="p">PREÇO</span>`;
 el("arvore").innerHTML=tree(g,n,0)+`<div class="thead"><span>TOTAL GERAL</span><span class="q">${r.length}</span><span class="p">${$(tot)}</span></div>`;
 // dados
 el("tb").innerHTML=`<tr>${COLS.map(c=>`<th>${c}</th>`).join("")}</tr>`+[...r].sort((a,b)=>P(b)-P(a)).map(d=>`<tr>${COLS.map(c=>c==="PREÇO"?`<td class="num">${$(P(d))}</td>`:`<td>${d[c]??"—"}</td>`).join("")}</tr>`).join("");
 abrir(aba)}

function abrir(t){aba=t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
 ["painel","rel","dados"].forEach(s=>el(s).classList.toggle("hidden",s!==t))}
document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>abrir(x.dataset.t));
el("exp").onclick=()=>document.querySelectorAll("#arvore details").forEach(d=>d.open=true);
el("rec").onclick=()=>document.querySelectorAll("#arvore details").forEach(d=>d.open=false);
el("refresh").onclick=carregar;carregar();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
